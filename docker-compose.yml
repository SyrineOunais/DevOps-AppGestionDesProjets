services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: backend:1.0
    container_name: backend
    ports:
      - "8081:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: frontend:1.0
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge

